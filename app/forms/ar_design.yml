## YAML Template for design
---
table: ar_design

index:
  filter: description, body as text_field, site_id
  actions: standard

  data_set:
    actions:
      1: edit
      2:
        type: duplicate
        dup_fields: description

      3: delete

    columns:
      10:
        name: description
        width: 50%
      20:
        name: updated_at

form:
  title: 
    field: name
    
  actions: standard

  tabs:
    tab1:
      10:
        name: description
        type: text_field
        size: 50
      20:
        name: site_id
        type: select
        choices: eval ArSite.choices_for_sites
        include_blank: true

      50:
        name: rails_view
        type: text_field
        size: 50
          
      60:
        name: code
        type: text_area
        size: 100x8

      70:
        name: params
        type: text_area
        size: 100x8

      80:
        name: css
        type: text_area
        size: 100x10
        
    tab2:
      10:
        name: body
        type: text_area
        size: 120x30

    tab3:
      10:
        name: ar_parts
        type: belongs_to
        caption: false
        form_name: ar_part
        load: delay

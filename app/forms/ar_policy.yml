## YAML Template for Policy
---
table: ar_policy
control: belongs_to

index:
  actions: standard

  data_set:
    actions:
      1: edit
      2: delete

    columns:
      10:
        name: is_default
        width: 10%
        eval: agile_icon_for_boolean
      20:
        name: name
        width: 20%
      30:
        name: description
        width: 50%

      100:
        name: active
        width: 5%
        eval: agile_icon_for_boolean

form:
  actions: standard
  title: 
    field: name  

  fields:
    10:
      name: name
      type: text_field
      size: 50

    20:
      name: description
      type: text_field
      html:
        size: 50
    30:
      name: is_default
      type: check_box

    40:
      name: message
      type: text_area
      size: 100x5

    50:
      name: active
      type: check_box

    60:
      name: policy_rules
      caption: false
      type: belongs_to
      table: ar_policy_rule

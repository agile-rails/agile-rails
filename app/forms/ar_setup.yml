table: ar_setup

index:
  filter: data as text_field
  actions: standard
  
  data_set:
    actions: standard

    columns:
      10:
        name: name
        width: 20%
      20:
        name: updated_at
        format: D
        width: 10%

form:
  title:
    field: name
  actions: standard

  tabs:
    tab0:
      10:
        name: name
        type: text_field
        size: 20

      20:
        name: editors
        type: multitext_autocomplete
        search: ar_user.name
        size: 30

    tab00:
      10:
        name: form
        type: text_area
        size: 80x50

css: '
#record_form {font-family: monospace; font-size: 12px;}
'